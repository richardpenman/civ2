# Publishes the browser version (docs/BROWSER.md) to GitHub Pages,
# https://openciv2.github.io/openciv2/, on every push to main once CI
# (ci.yml) has passed for it (workflow_run: the commit CI tested, never one
# whose tests failed or were cancelled; by hand, workflow_dispatch: main as
# it is): build/web as
# make web makes it, but never with the original game (no GAME=1: the site
# starts straight into the game with the HD graphics and OpenCiv2's own
# texts, rules, music, sound effects, heralds and wonder movie;
# src/web/main.js).  The HD art (data/native/hd) and OpenCiv2's own files
# (data/native/music, sound, heralds, wonders) are made as the release
# makes them (.github/workflows/release.yml: the jobs hd-art and own-assets,
# with the same caches), then tools/build_web.py runs with them (the game
# as a wasm module with wasi-sdk, wasm-opt from Binaryen: tools/
# fetch-toolchain.sh and fetch-toolchain.sh web).  Before it is published, a
# check fails the run if the site has anything of the original game.
name: Browser version on GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# (one deployment at a time; a newer push's waits, the one being made ends)
concurrency:
  group: pages
  cancel-in-progress: false

# (the commit CI passed: workflow_run's head_sha; by hand, the one run on)
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Only after CI passed for a push to main (or by hand)
  tested:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - run: echo "CI passed for $SHA"

  # The HD graphics' art: as release.yml's hd-art (its cache shared)
  hd-art:
    needs: tested
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/openciv2
          key: hd-art-git-${{ hashFiles('data/hd-pack.json', 'tools/build_hd_pack.py') }}
          restore-keys: hd-art-git-
      - name: The art
        run: python3 tools/build_hd_pack.py
      - uses: actions/upload-artifact@v7
        with:
          name: hd-art
          path: data/native/hd
          retention-days: 1

  # OpenCiv2's own music, sound effects, heralds and wonder movies: as
  # release.yml's own-assets (its cache shared)
  own-assets:
    needs: tested
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/openciv2
          key: own-assets-${{ hashFiles('data/own-assets.json', 'tools/build_own_assets.py') }}
          restore-keys: own-assets-
      - name: The music, sound effects, heralds, wonder movies and portraits
        run: python3 tools/build_own_assets.py
      - uses: actions/upload-artifact@v7
        with:
          name: own-assets
          path: |
            data/native/music
            data/native/sound
            data/native/heralds
            data/native/wonders
            data/native/portraits
          retention-days: 1

  site:
    needs: [hd-art, own-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: hd-art
          path: data/native/hd
      - uses: actions/download-artifact@v8
        with:
          name: own-assets
          path: data/native
      - name: Toolchain (wasi-sdk, wabt, the set-up's sources; Binaryen)
        run: |
          sh tools/fetch-toolchain.sh
          sh tools/fetch-toolchain.sh web
      - name: The site (make web without GAME)
        env:
          HD_ART: 1
          OWN_ASSETS: 1
          GAME: ''
        # (make web is these with tools/build_hd_pack.py and
        # build_own_assets.py first: their results are the artifacts above)
        run: |
          set -o pipefail
          python3 tools/build_web.py 2>&1 | tee build.log || { grep -E "error|Error" build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      # Nothing of the original game on the site: no game/ (GAME=1's copy),
      # none of its kinds of files (programs, DLLs, videos, WAVs, GIFs,
      # saves, scenarios, archives, disc images), the game's text files only
      # as OpenCiv2's own (data/text/NAME.TXT.gz: data/native/text's, in the
      # repository, byte for byte), every other .txt a translation
      # (data/native/lang's, byte for byte) or a licence's notice; the
      # site's sounds only OpenCiv2's (data/music, sound, wonders) and its
      # pictures only those hd/index.json lists from the art pack (and
      # hd/title.webp, the start screen's backdrop: its tiles.dll 90),
      # OpenCiv2's heralds and its historical leaders' portraits
      # (portraits/leader-ID.webp; and its wonder movies'); the art and the
      # own assets there.
      - name: No original game files on the site
        run: |
          python3 - <<'PY'
          import gzip, json, os, sys
          web, native = 'build/web', 'data/native'
          bad = []
          if os.path.exists(os.path.join(web, 'game')):
              bad.append('game/ (the original game: GAME=1)')
          forbidden = ('.exe', '.dll', '.avi', '.wav', '.gif', '.bmp', '.ico', '.cur', '.fon', '.flc', '.fli',
                       '.mid', '.sav', '.net', '.scn', '.mp', '.map', '.hlp', '.cnt', '.zip', '.cab', '.hdr',
                       '.cue', '.iso', '.bin', '.img', '.ini', '.dat', '.lnk', '.log')
          notices = {'data/fonts/OFL.txt', 'data/music/README.txt', 'hd/THIRD-PARTY.txt'}
          sounds = ('data/music/', 'data/sound/', 'data/wonders/')
          count = 0
          for d, _, files in os.walk(web):
              for f in files:
                  count += 1
                  rel = os.path.relpath(os.path.join(d, f), web).replace(os.sep, '/')
                  low = rel.lower()
                  plain = low[:-3] if low.endswith('.gz') else low
                  if rel == 'hd/art.bin':
                      continue                    # (the art pack: hd/index.json, checked below)
                  if rel in ('data/fonts_win.bin.gz', 'data/fonts_win_aa.bin.gz'):
                      if gzip.open(os.path.join(d, f)).read() != open(os.path.join(native, f[:-3]), 'rb').read():
                          bad.append(rel + ' (not OpenCiv2\'s own data/native)')
                      continue                    # (OpenCiv2's fonts, in the repository)
                  if plain.endswith(forbidden):
                      bad.append(rel)
                  elif plain.endswith('.txt'):
                      if rel.startswith('data/text/') and rel.endswith('.TXT.gz'):
                          own = os.path.join(native, 'text', f[:-3])
                          if not os.path.exists(own) or gzip.open(os.path.join(d, f)).read() != open(own, 'rb').read():
                              bad.append(rel + ' (not OpenCiv2\'s own data/native/text)')
                      elif rel.startswith('lang/'):
                          own = os.path.join(native, 'lang', f)
                          if not os.path.exists(own) or open(os.path.join(d, f), 'rb').read() != open(own, 'rb').read():
                              bad.append(rel + ' (not OpenCiv2\'s own data/native/lang)')
                      elif rel not in notices:
                          bad.append(rel)
                  elif plain.endswith(('.ogg', '.mp3', '.flac', '.opus')) and not rel.startswith(sounds):
                      bad.append(rel)
                  elif rel == 'hd/title.webp':
                      if open(os.path.join(d, f), 'rb').read() != \
                              open(os.path.join(native, 'hd', 'resource_tiles.dll_gifs_90.webp'), 'rb').read():
                          bad.append(rel + ' (not the art pack\'s tiles.dll 90)')
                  elif plain.endswith(('.webp', '.png', '.jpg', '.jpeg')) and not rel.startswith('data/wonders/'):
                      bad.append(rel + ' (pictures belong in hd/art.bin)')
          art = json.load(open(os.path.join(web, 'hd', 'index.json')))
          for path, _ in art:
              top, name = path.split('/', 1)
              if top == 'portraits':
                  ok = name.startswith('leader-') and name.endswith('.webp') and name[7:-5].isdigit() and \
                      220 <= int(name[7:-5]) <= 261
              else:
                  ok = top in ('hd', 'heralds') and (name in ('pictures.txt', 'heralds.txt') or
                                                     name.endswith(('.webp', '.png')))
              if not ok:
                  bad.append('hd/art.bin: ' + path)
          if not any(p == 'hd/pictures.txt' for p, _ in art):
              bad.append('hd/art.bin: no HD art (data/native/hd)')
          for d in ('music', 'sound', 'wonders'):
              if not json.load(open(os.path.join(web, 'data', d, 'index.json'))):
                  bad.append('data/%s: none of OpenCiv2\'s own' % d)
          for b in bad:
              print('::error::%s' % b)
          if bad:
              sys.exit('%d files not OpenCiv2\'s own on the site' % len(bad))
          print('%d files checked: none of the original game; %d in hd/art.bin' % (count, len(art)))
          PY
          du -sh build/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
